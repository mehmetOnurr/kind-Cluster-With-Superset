kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: superset-dev
nodes:
  - role: control-plane
    extraPortMappings:
      - containerPort: 30088
        hostPort: 30088
        protocol: TCP
    kubeadmConfigPatches:
      - |
        kind: InitConfiguration
        nodeRegistration:
          kubeletExtraArgs:
            node-labels: "ingress-ready=true"
            authorization-mode: AlwaysAllow
    extraMounts:
      - hostPath: ./plugins
        containerPath: /app/pythonpath/plugins
  - role: worker
  - role: worker
networking:
  disableDefaultCNI: false
  podSubnet: "10.244.0.0/16"
  serviceSubnet: "10.96.0.0/12"
